[project]
name = "bt-cloudflare-tunnel"
version = "0.1.2"
description = "Baota Panel Cloudflare Tunnel developer plugin"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportImplicitRelativeImport = "none"
reportImplicitOverride = "none"
